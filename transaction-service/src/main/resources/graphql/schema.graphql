type Transaction {
    id: ID!
    accountId: ID!
    amount: Float!
    currency: String!
    merchantCategory: String!
    country: String!
    createdAt: String!
}

input CreateTransactionInput {
    accountId: ID!
    amount: Float!
    currency: String!
    merchantCategory: String!
    country: String!
}

input TransferInput {
    sourceAccountId: ID!
    destinationAccountId: ID!
    amount: Float!
    currency: String!
}

type Query {
    transactions: [Transaction!]!
    transactionsByAccount(accountId: ID!): [Transaction!]!
}

type Mutation {
    createTransaction(input: CreateTransactionInput!): Transaction!
    transfer(input: TransferInput!): [Transaction!]!
}
