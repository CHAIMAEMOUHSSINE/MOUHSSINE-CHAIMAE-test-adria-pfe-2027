spring.application.name=transaction-service
server.port=${SERVER_PORT:8082}
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.datasource.url=${DB_URL:jdbc:h2:mem:transactiondb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.properties.spring.json.trusted.packages=net.chaimae.transactionservice.messaging
spring.ai.mcp.server.name=transaction-service
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
bank.transaction.max-amount=${BANK_TRANSACTION_MAX_AMOUNT:1000}
bank.kafka.transactions-topic=${BANK_KAFKA_TRANSACTIONS_TOPIC:bank.transactions.created}
bank.kafka.consumer-group=${BANK_KAFKA_CONSUMER_GROUP:transaction-audit}
resilience4j.circuitbreaker.instances.accountService.sliding-window-size=10
resilience4j.circuitbreaker.instances.accountService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accountService.wait-duration-in-open-state=10s
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
