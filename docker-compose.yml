services:
  discovery-service:
    build: ./discovery-service
    ports: ["8761:8761"]
  kafka:
    image: bitnami/kafka:3.9
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
  account-service:
    build: ./account-service
    depends_on: [discovery-service]
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka
    ports: ["8081:8081"]
  transaction-service:
    build: ./transaction-service
    depends_on: [discovery-service, account-service, kafka]
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka
      ACCOUNT_SERVICE_URL: http://account-service:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports: ["8082:8082"]
  gateway-service:
    build: ./gateway-service
    depends_on: [discovery-service, account-service, transaction-service]
    environment:
      EUREKA_URL: http://discovery-service:8761/eureka
    ports: ["8080:8080"]
  frontend:
    build: ./frontend
    depends_on: [gateway-service]
    ports: ["4200:80"]
