name: build-test-publish
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [account-service, transaction-service, discovery-service, gateway-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
        working-directory: ${{ matrix.module }}
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, frontend]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./transaction-service
          push: true
          tags: ghcr.io/${{ github.repository }}/transaction-service:latest
      - run: echo "Deployment stage: promote the immutable image through the target environment."
