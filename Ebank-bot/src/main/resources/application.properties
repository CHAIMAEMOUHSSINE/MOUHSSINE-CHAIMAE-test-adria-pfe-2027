spring.application.name=Ebank-bot
server.port=8058

spring.ai.model.chat=openai
spring.ai.openai.api-key={open.ai.key}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=qwen/qwen3.8-27b

spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false
eureka.client.enabled=false

# MCP client -> Stock-service
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.type=sync
spring.ai.mcp.client.toolcallback.enabled=true
spring.ai.mcp.client.streamable-http.connections.stock.url=http://localhost:8081
spring.ai.mcp.client.streamable-http.connections.stock.endpoint=/mcp

telegram.token={telegram.token}